<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon.png"
    />
    <base href="/" />
    <link rel="stylesheet" href="./scss//main.scss" />
    <script type="module" src="./js/main.js"></script>
    <title>Furniro | Home</title>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container container--wide header__inner">
        <a href="#/" class="header__logo">
          <img src="./assets/images/Logo.png" alt="Logo" />
        </a>

        <!-- HAMBURGER -->
        <button
          class="header__toggle"
          aria-label="Open menu"
          data-action="open-menu"
        >
          <span class="header__toggle-line"></span>
          <span class="header__toggle-line"></span>
          <span class="header__toggle-line"></span>
        </button>

        <nav class="header__nav" aria-label="Main navigation">
          <ul class="header__nav-list">
            <li class="nav__item">
              <a href="#/" class="header__nav-link nav-link" data-route="home"
                >Home</a
              >
            </li>
            <li class="header__nav-item">
              <a
                href="#/shop"
                class="header__nav-link nav-link"
                data-route="shop"
                >Shop</a
              >
            </li>
            <li class="header__nav-item">
              <a
                href="#/about"
                class="header__nav-link nav-link"
                data-route="about"
                >About</a
              >
            </li>
            <li class="header__nav-item">
              <a
                href="#/contact"
                class="header__nav-link nav-link"
                data-route="contact"
                >Contact</a
              >
            </li>
          </ul>
        </nav>

        <div class="header__actions">
          <ul class="header__actions-list">
            <li>
              <a href="#" aria-label="Account">
                <svg class="icon">
                  <use href="./assets/icons/sprite.svg#icon-user"></use>
                </svg>
              </a>
            </li>
            <li class="header__search-item">
              <div class="header__search-wrapper">
                <input
                  type="text"
                  class="header__search-input"
                  data-input="search"
                  placeholder="Search..."
                  aria-label="Search products"
                />
                <button data-action="toggle-search">
                  <svg class="icon">
                    <use href="./assets/icons/sprite.svg#icon-search"></use>
                  </svg>
                </button>

                <div class="header__search-results">
                  <ul class="header__search-list"></ul>
                </div>
              </div>
            </li>

            <li class="header__compare-item">
              <button
                aria-label="Compare"
                class="header__compare-button header__compare-item"
                data-action="open-compare-tray"
              >
                <svg class="icon">
                  <use href="./assets/icons/sprite.svg#icon-tab"></use>
                </svg>
                <span class="header__count-compare"></span>
              </button>
            </li>

            <li class="header__wishlist-item">
              <a href="#/wishlist" aria-label="Wishlist">
                <svg class="icon">
                  <use href="./assets/icons/sprite.svg#icon-heart"></use>
                </svg>
                <span class="header__count-wishlist"></span>
              </a>
            </li>

            <li class="header__cart-item">
              <a href="#/cart" aria-label="Cart">
                <svg class="icon icon-search">
                  <use href="./assets/icons/sprite.svg#icon-cart"></use>
                </svg>
                <span class="header__count-cart"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <div id="app"></div>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__inner container">
        <div class="footer__info">
          <a href="#/" class="footer__logo">
            <img src="./assets/images/Logo.png" alt="Logo" />
          </a>
          <p class="footer__address text-body">
            400 University Drive Suite 200 Coral Gables, <br />FL 33134 USA
          </p>
        </div>

        <ul class="footer__links">
          <li class="footer__heading">Links</li>
          <li class="footer__item">
            <a href="#/" class="footer__link" data-route="home">Home</a>
          </li>
          <li class="footer__item">
            <a href="#/shop" class="footer__link" data-route="shop">Shop</a>
          </li>
          <li class="footer__item">
            <a href="#/about" class="footer__link" data-route="about">About</a>
          </li>
          <li class="footer__item">
            <a href="#/contact" class="footer__link" data-route="contact"
              >Contact</a
            >
          </li>
        </ul>

        <ul class="footer__links">
          <li class="footer__heading">Help</li>
          <li class="footer__item">
            <a href="#/payment" class="footer__link" data-route="payment"
              >Payment Options</a
            >
          </li>
          <li class="footer__item">
            <a href="#/returns" class="footer__link" data-route="returns"
              >Returns</a
            >
          </li>
          <li class="footer__item">
            <a href="#/policy" class="footer__link" data-route="policy"
              >Privacy Policy</a
            >
          </li>
        </ul>

        <div class="footer__newsletter">
          <h4 class="footer__heading">Newsletter</h4>
          <form action="#" class="footer__form">
            <input
              type="email"
              class="footer__mail"
              id="mail"
              placeholder="Enter Your Email Address"
            />

            <button class="footer__submit btn">Subscribe</button>
          </form>
        </div>

        <div class="footer__rights">
          <p>2023 Furniro. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <!-- COMPARE SLOTS -->
    <div class="compare-tray"></div>
  </body>
</html>
